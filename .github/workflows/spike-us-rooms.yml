name: spike-us-rooms-http

# THROWAWAY. Exists only on the spike/us-rooms-http branch, never on main.
#
# Repeated small probe of Zumper and Craigslist: 6 snapshots, one every 8 hours
# (slot k runs at t0 + 8h*k), to see whether a GitHub runner keeps getting 200s
# and how the inventory moves. It only OBSERVES — an ad missing from a snapshot
# is recorded as absent, never as GONE.
#
# `schedule:` only fires from the default branch, so instead each run waits for
# its slot, captures, commits its snapshot to this branch, and dispatches the
# next slot itself (a job is capped at 6 h, so a distant slot is reached by
# relaying). Bounded: slot 5 is the last, and the chain also ends if both sources
# get blocked. Uses only the automatic GITHUB_TOKEN; no repository secrets.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "snapshot number, 0..5"
        default: "0"
      t0:
        description: "ISO time of slot 0 (UTC)"
        required: true

permissions:
  contents: write   # commit the snapshot to THIS branch only
  actions: write    # dispatch the next slot of THIS workflow

concurrency:
  group: spike-us-rooms
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: spike/us-rooms-http
      SLOT: ${{ inputs.slot }}
      T0: ${{ inputs.t0 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spike/us-rooms-http
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: wait for this slot
        id: wait
        run: python spike/wait_for_slot.py "$SLOT" "$T0" | tee /tmp/wait.log && echo "$(grep wait_result= /tmp/wait.log)" >> "$GITHUB_OUTPUT"

      - name: relay (slot still too far away for one job)
        if: steps.wait.outputs.wait_result == 'relay'
        run: gh workflow run spike-us-rooms.yml --ref "$BRANCH" -f slot="$SLOT" -f t0="$T0"

      - name: capture
        id: capture
        if: steps.wait.outputs.wait_result == 'capture'
        run: |
          set +e
          python spike/gha_probe2.py "$SLOT"
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: keep the snapshot as an artifact
        if: always() && steps.wait.outputs.wait_result == 'capture'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-slot-${{ inputs.slot }}
          path: spike/data/
          if-no-files-found: warn

      - name: commit the snapshot to the spike branch
        if: always() && steps.wait.outputs.wait_result == 'capture'
        continue-on-error: true      # the artifact above is the safety net; don't let this cut the chain
        run: |
          git config user.name  "spike bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f spike/data      # spike/data is in a .gitignore
          git commit -m "spike data: snapshot slot $SLOT" || echo "nothing to commit"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: dispatch the next slot
        if: always() && steps.wait.outputs.wait_result == 'capture' && steps.capture.outputs.rc == '0' && inputs.slot != '5'
        run: gh workflow run spike-us-rooms.yml --ref "$BRANCH" -f slot="$(( SLOT + 1 ))" -f t0="$T0"
