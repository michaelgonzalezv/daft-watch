name: spike-cloudflare

# Manual only. Answers one question: does headless Chromium clear daft.ie's
# Cloudflare from a GitHub-hosted runner (datacenter IP)?
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - run: python -m playwright install --with-deps chromium

      - name: probe daft.ie
        env:
          DAFT_WATCH_STATE: ${{ runner.temp }}/pw-state.json
        run: python .github/scripts/probe_cloudflare.py
