# Config for the GitHub Actions run (see .github/workflows/scrape.yml).
# Paths are relative to the workspace: caleta-web is checked out into ./caleta-web
# and the DB is restored to ./data/daft.db from the db-state branch.
interval_minutes: 30
gone_after_cycles: 2
rate_limit_seconds: 3
detail_price_cap: 100000000
detail_max_per_cycle: 120

searches:
  - name: "Cork sharing"
    category: sharing
    params: { location: [cork-city] }
  - name: "Limerick sharing"
    category: sharing
    params: { location: [limerick-city] }
  - name: "Dublin sharing"
    category: sharing
    params: { location: [dublin-city] }

  # Canada (Kijiji "Room Rentals & Roommates", category id 36). location_id
  # is Kijiji's own numeric region id — the URL's city slug is cosmetic, only
  # this id and the category id route the search (verified by hand).
  - name: "Toronto sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700273" }
  - name: "Mississauga sharing"          # includes Brampton (Peel Region)
    category: sharing
    source: kijiji
    params: { location_id: "1700276" }
  - name: "Montreal sharing"
    category: sharing
    source: kijiji
    params: { location_id: "80002" }
  - name: "Ottawa sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700184" }
  - name: "Calgary sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700199" }
  - name: "Hamilton sharing"
    category: sharing
    source: kijiji
    params: { location_id: "80014" }
  - name: "Kitchener sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700209" }
  - name: "Edmonton sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700202" }
  - name: "London sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700214" }
  - name: "Vancouver sharing"
    category: sharing
    source: kijiji
    params: { location_id: "80003" }
  - name: "Winnipeg sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700192" }
  - name: "St. Catharines sharing"
    category: sharing
    source: kijiji
    params: { location_id: "80016" }
  - name: "Halifax sharing"
    category: sharing
    source: kijiji
    params: { location_id: "80010" }
  - name: "Quebec City sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700124" }
  - name: "Saskatoon sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700197" }
  - name: "Regina sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700194" }
  - name: "Kelowna sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700228" }
  - name: "Victoria sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700173" }
  - name: "Windsor sharing"
    category: sharing
    source: kijiji
    params: { location_id: "1700220" }

filters:
  max_sharing_with: 4
  keywords_exclude: []

publish:
  json_path: "caleta-web/dashboards/rentals/listings.json"
  repo_dir: "caleta-web"
  file_rel: "dashboards/rentals/listings.json"
  git_push: true
  events_path: "caleta-web/dashboards/rentals/events.json"
  events_rel: "dashboards/rentals/events.json"
  history_path: "caleta-web/dashboards/rentals/history.json"
  history_rel: "dashboards/rentals/history.json"
  compare_path: "caleta-web/dashboards/rentals/compare.json"
  compare_rel: "dashboards/rentals/compare.json"

email:
  max_price: 800
  distance_km: { dublin: 6, cork: 4, limerick: 4 }

notify:
  min_event_types: [NEW, PRICE_DROP]

export_gone_within_days: 30
events_history_days: 90
price_history_days: 400
# no `backup:` block here — on CI the DB is persisted via the db-state branch
